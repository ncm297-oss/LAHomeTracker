# Tracker configuration. Everything the weekly job needs that isn't a secret.
# Secrets (API keys, Gmail token) come from .env locally or GitHub secrets.

price_band:
  min: 2000000
  max: 3200000
cash_ceiling: 3500000

# Rent range you'd otherwise pay; used for verdict text and the rent-equivalent check.
rent_band: [6000, 8000]

# Neighborhood profiles. zips drive listing pulls and zip -> neighborhood mapping.
# prop_tax_rate / fire_risk / insurance mirror docs/assumptions.js and feed the
# per-listing cost profile that scoring and the calculator link use.
neighborhoods:
  santa_monica:   {name: Santa Monica,   city: Santa Monica, zips: ["90401", "90402", "90403", "90404"], prop_tax_rate: 0.0129, fire_risk: low,   insurance: 9000}
  ocean_park:     {name: Ocean Park,     city: Santa Monica, zips: ["90405"],                             prop_tax_rate: 0.0129, fire_risk: low,   insurance: 9000}
  marina_del_rey: {name: Marina del Rey, city: Marina del Rey, zips: ["90292"],                           prop_tax_rate: 0.0117, fire_risk: low,   insurance: 9000}
  sawtelle:       {name: Sawtelle,       city: Los Angeles,  zips: ["90025"],                             prop_tax_rate: 0.0119, fire_risk: low,   insurance: 9000}
  westwood:       {name: Westwood,       city: Los Angeles,  zips: ["90024"],                             prop_tax_rate: 0.0119, fire_risk: low,   insurance: 9000}
  west_la:        {name: West LA,        city: Los Angeles,  zips: ["90064"],                             prop_tax_rate: 0.0119, fire_risk: low,   insurance: 9000}
  brentwood:      {name: Brentwood,      city: Los Angeles,  zips: ["90049"],                             prop_tax_rate: 0.0119, fire_risk: mixed, insurance: 15000}
  culver_city:    {name: Culver City,    city: Culver City,  zips: ["90230", "90232"],                    prop_tax_rate: 0.0115, fire_risk: low,   insurance: 9000}
  mar_vista:      {name: Mar Vista,      city: Los Angeles,  zips: ["90066"],                             prop_tax_rate: 0.0119, fire_risk: low,   insurance: 9000}

# Property types to keep from listing pulls.
property_types: ["Single Family", "Townhouse", "Condo", "Multi-Family"]

scoring:
  # Weights are relative; components with no data are dropped and the rest renormalized.
  weights:
    ppsf: 25          # $/sqft vs neighborhood sold-comp median
    cuts: 15          # cumulative reduction from original list + number of cuts
    dom: 10           # days on market vs neighborhood median
    below_last_sale: 10
    yield: 15         # gross rent yield
    breakeven: 25     # Phase 1 breakeven price vs asking
  comps_window_months: 9
  comps_min_count: 5
  yield_flag: 0.04
  digest_threshold: 60

# Buy-vs-rent defaults used for the breakeven component (mirrors docs/calc.js DEFAULTS).
buyrent:
  years: 7
  opp_rate: 0.07
  opp_tax_mode: deferred
  appreciation: 0.03
  rent_growth: 0.03
  maint_rate: 0.01
  buy_close: 0.01
  sell_close: 0.058
  expense_inflation: 0.03
  fed_rate: 0.24
  ca_rate: 0.093
  ltcg_fed_rate: 0.15
  ltcg_high_rate: 0.20
  ltcg_top: 613700
  ordinary_taxable: 298000
  niit_rate: 0.038
  prop13_cap: 0.02
  cg_exclusion: 500000

rates:
  series:
    MORTGAGE30US: Freddie Mac 30-year fixed
    OBMMIJUMBO30YF: Optimal Blue 30-year jumbo
    DGS10: 10-year Treasury
    DGS3MO: 3-month Treasury
  history_years: 3

market:
  fred_series:
    PRIREDCOU6037: LA County price-reduced listings (Realtor.com)
    ACTLISCOU6037: LA County active listings
    MEDDAYONMAR6037: LA County median days on market
    MEDLISPRIPERSQUFEE6037: LA County median list $/sqft
  zillow:
    metro_name: "Los Angeles, CA"
    files:
      inventory: https://files.zillowstatic.com/research/public_csvs/invt_fs/Metro_invt_fs_uc_sfrcondo_sm_month.csv
      days_to_pending: https://files.zillowstatic.com/research/public_csvs/mean_doz_pending/Metro_mean_doz_pending_uc_sfrcondo_sm_month.csv
      sale_to_list: https://files.zillowstatic.com/research/public_csvs/mean_sale_to_list/Metro_mean_sale_to_list_uc_sfrcondo_sm_month.csv
      zhvi_zip: https://files.zillowstatic.com/research/public_csvs/zhvi/Zip_zhvi_uc_sfrcondo_tier_0.33_0.67_sm_sa_month.csv
      zori_zip: https://files.zillowstatic.com/research/public_csvs/zori/Zip_zori_uc_sfrcondomfr_sm_month.csv

alerts:
  leverage_crossover: true        # after-tax jumbo < after-tax retained return
  refi_drop_points: 0.75          # 30-yr falls this far below a saved scenario's rate
  ten_year_move_points: 0.5       # |DGS10 change| over ~30 days
  retained_rate: 0.07
  retained_tax_mode: deferred

sources:
  rentcast:
    enabled: true
    base_url: https://api.rentcast.io/v1
    listing_limit: 500
    rent_estimates: true          # per-listing AVM (1 request each); only used by `enrich`, top-scored first
    monthly_budget: 50            # free tier; enrich stops at this count, digest warns when exceeded
  homeharvest:
    enabled: true                 # fallback for listings; main source for sold comps
    past_days_sold: 270
    pause_seconds: 3
  gmail:
    enabled: true
    query: 'newer_than:8d (from:redfin.com OR from:zillow.com OR subject:"price" OR subject:"new listing")'
  redfin_csv:
    enabled: true
    inbox: data/inbox
  zillow_research:
    enabled: true
  redfin_datacenter:
    enabled: false                # multi-hundred-MB files; import manually from data/inbox

digest:
  max_listings: 15
  include_multi_family: false     # you're buying a home, not a building; flip if house-hacking
  subject_prefix: "[LA Tracker]"
