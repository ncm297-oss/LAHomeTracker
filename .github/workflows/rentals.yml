name: Daily rentals

on:
  schedule:
    - cron: "0 15 * * *"   # 08:00 Pacific (15:00 UTC; 07:00 PT in winter)
  workflow_dispatch:

permissions:
  contents: write
  issues: write              # new-listing notice (see the last step)

concurrency:
  group: rentals
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -e ".[gmail,homeharvest]"

      - name: Run rentals
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: python -m tracker run-rentals

      # Only the rentals files are committed, so this never collides with the weekly job's
      # tracker.sqlite; rebase in case that job pushed while this one ran.
      - name: Commit data
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add data/rentals.sqlite docs/data/rentals.json
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "Rentals refresh $(date -u +%F)"
          git pull --rebase
          git push

      # run-rentals writes a notice when homes appear in rentals.notify.zips. The issue
      # @mentions the owner, and GitHub emails the mention: no mail credentials needed.
      - name: Announce new listings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f data/cache/new_rentals.md ] || { echo "nothing new"; exit 0; }
          gh issue create --title "$(cat data/cache/new_rentals_title.txt)" --body-file data/cache/new_rentals.md
