name: Weekly triage

on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays 06:00 Pacific (13:00 UTC; 14:00 UTC in winter)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip sending the digest (prints it to the log instead)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -e ".[gmail,homeharvest]"

      - name: Run tracker
        env:
          RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ] || [ -z "$GMAIL_TOKEN_JSON" ]; then
            python -m tracker run-weekly --dry-run
          else
            python -m tracker run-weekly
          fi

      - name: Commit data
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add data/tracker.sqlite docs/data/*.json
          git diff --cached --quiet && echo "no changes" || git commit -m "Weekly data refresh $(date -u +%F)"
          git push
